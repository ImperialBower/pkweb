<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Poker hand-analysis and GTO components — themeable, dependency-free, client-side.">
  <title>pkweb — poker component library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="theme-midnight four-color">

  <header id="topbar">
    <div class="brand-group">
      <div class="brand">PK<span class="brand-accent">COMPONENTS</span></div>
      <div class="tagline">HAND ANALYSIS · GTO TOOLKIT</div>
    </div>
    <div class="topbar-controls">
      <a class="chip chip-sm" href="examples/index.html">EXAMPLES →</a>
      <span class="topbar-divider"></span>
      <div id="theme-chips" class="theme-chips"></div>
      <span class="topbar-divider"></span>
      <div class="tagline">BTN vs BB · 100BB · NLHE</div>
      <button id="deck-toggle" type="button" class="chip chip-toggle" title="Toggle 2/4-color deck">
        4-COLOR<span class="dot"></span>
      </button>
    </div>
  </header>

  <main id="gallery">
    <div data-pk="replayer"></div>

    <div class="row row-3">
      <div data-pk="board"></div>
      <div data-pk="equity"></div>
      <div data-pk="stack"></div>
    </div>

    <div data-pk="timeline"></div>

    <div class="row row-2">
      <div data-pk="range-grid"></div>
      <div data-pk="strategy-mix"></div>
    </div>

    <div class="row row-2">
      <div data-pk="range-vs-range"></div>
      <div data-pk="combos"></div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
