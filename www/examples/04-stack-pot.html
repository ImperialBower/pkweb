<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — stack, pot and SPR derived from an open and a barrel line.">
  <title>04 · Stack & pot — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <template id="demo">
    <div data-pk="stack"
         data-stack="100"
         data-open="2.5"
         data-barrel="33 75 66"
         data-players="2"
         data-street="preflop"></div>
  </template>

  <script type="module">
    import { initExample, seatChips, streetChips } from '../js/example.js';

    const page = initExample('stack-pot');
    page.controls.append(...seatChips(page.store), ...streetChips(page.store));
  </script>
</body>
</html>
