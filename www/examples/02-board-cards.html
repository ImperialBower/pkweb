<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — hole cards and board, configured from HTML.">
  <title>02 · Board + hole cards — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <template id="demo">
    <div data-pk="board"
         data-hero="Ah Kh"
         data-board="Ks 7d 2h 9c 4s"
         data-street="flop">
      <script type="application/json">
        { "evals": ["A♥K♥ — suited broadway",
                    "Top pair, top kicker",
                    "Top pair — 9 adds draws",
                    "Top pair, top kicker — value"] }
      </script>
    </div>
  </template>

  <script type="module">
    import { initExample, streetChips } from '../js/example.js';

    const page = initExample('board-cards');
    page.controls.append(...streetChips(page.store));   // demo-only driver
  </script>
</body>
</html>
