<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — hero equity for the selected street plus the by-street history.">
  <title>03 · Equity vs BB range — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <script type="module">
    import { createStore } from '../js/store.js';
    import { createEquity } from '../js/components/equity.js';
    import { initExample, streetChips } from '../js/example.js';

    const page = initExample('equity');

    const store = createStore({ street: 0 });
    page.demo.append(createEquity(store));

    // The history columns already write `street`; these chips prove it by
    // staying in sync when you click a bar instead of a chip.
    page.controls.append(...streetChips(store));
    window.pkweb = { store };
  </script>
</body>
</html>
