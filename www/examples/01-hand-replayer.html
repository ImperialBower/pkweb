<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — the hand replayer, configured from HTML.">
  <title>01 · Hand replayer — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <template id="demo">
    <div data-pk="replayer"
         data-hero="Ah Kh"
         data-villain="Kc Jc"
         data-board="Ks 7d 2h 9c 4s"
         data-players="2"
         data-street="preflop"
         data-open="2.5"
         data-barrel="33 75 66"
         data-stack="100"
         data-game="NO LIMIT HOLD'EM">
      <script type="application/json">
        { "names": { "BTN": "Hero", "BB": "Villain" },
          "evals": ["A♥K♥ — suited broadway",
                    "Top pair, top kicker",
                    "Top pair — 9 adds draws",
                    "Top pair, top kicker — value"] }
      </script>
    </div>
  </template>

  <script type="module">
    import { initExample } from '../js/example.js';

    // The replayer ships its own seat and street chips, so this page adds none.
    initExample('hand-replayer');
  </script>
</body>
</html>
