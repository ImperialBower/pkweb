<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — a hand's action street by street, written in HTML.">
  <title>05 · Action timeline — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <template id="demo">
    <div data-pk="timeline"
         data-open="2.5"
         data-barrel="33 75 66"
         data-players="2"
         data-street="flop">
      <script type="application/json">
        { "actions": {
            "preflop": [["BTN", "raise 2.5bb"], ["BB", "call 2.5bb"]],
            "flop":    [["BB", "check"], ["BTN", "bet 1.7bb · 33%"], ["BB", "call"]],
            "turn":    [["BB", "check"], ["BTN", "bet 6.3bb · 75%"], ["BB", "call"]],
            "river":   [["BB", "check"], ["BTN", "bet 13.9bb · 66%"], ["BB", "call"]] } }
      </script>
    </div>
  </template>

  <script type="module">
    import { initExample, seatChips } from '../js/example.js';

    // Street is selected by clicking a column, so only the seat count needs
    // a driver here.
    const page = initExample('action-timeline');
    page.controls.append(...seatChips(page.store));
  </script>
</body>
</html>
