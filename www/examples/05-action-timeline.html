<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pkweb example — all four streets side by side with the pot each one builds.">
  <title>05 · Action timeline — pkweb examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&family=Archivo:wght@400;500;700;800&family=Marcellus&family=Caprasimo&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/examples.css">
</head>
<body class="theme-midnight four-color">

  <script type="module">
    import { createStore } from '../js/store.js';
    import { createTimeline } from '../js/components/timeline.js';
    import { initExample, seatChips } from '../js/example.js';

    const page = initExample('action-timeline');

    const store = createStore({ players: 2, street: 0 });
    page.demo.append(createTimeline(store));

    // Street is selected by clicking a column, so only the seat count needs
    // a driver here.
    page.controls.append(...seatChips(store));
    window.pkweb = { store };
  </script>
</body>
</html>
