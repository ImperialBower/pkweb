name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy www/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step — the library is plain HTML, CSS and ES modules.
      # This only guards against shipping a module that will not parse.
      - name: Check ES modules parse
        run: |
          for f in $(find www/js -name '*.js'); do
            node --check "$f"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './www'
      - id: deployment
        uses: actions/deploy-pages@v5
